name: build-and-test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: dotnet publish ASMarr/ASMarr.csproj -c Release -r linux-x64 --self-contained true -o publish
      - run: dotnet run --project tests/StoreTests/StoreTests.csproj -c Release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests PyYAML mutagen
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: PYTHONPATH=ASMarr/providers python -m unittest discover -s tests -v
      - run: npm ci
        working-directory: tests/browser
      - run: npx playwright install --with-deps chromium
        working-directory: tests/browser
      - run: npm test
        working-directory: tests/browser
